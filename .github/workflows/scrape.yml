name: Scrape ulasan harian

on:
  schedule:
    - cron: "0 22 * * *"      # 22:00 UTC = 06:00 WITA
  workflow_dispatch:           # tombol "Run workflow" manual

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # versi scikit-learn dipatok agar model tersimpan (joblib) selalu bisa dimuat
      - run: pip install -r requirements.txt
      - run: python scripts/scrape.py
      - name: Commit & push data terbaru
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "chore: update data ulasan"
          git pull --rebase
          git push
