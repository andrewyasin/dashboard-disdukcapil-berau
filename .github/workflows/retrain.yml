name: Latih ulang model sentimen

on:
  schedule:
    - cron: "0 20 1 * *"      # tanggal 1 tiap bulan, 04:00 WITA
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-train.txt
      - name: Latih dan evaluasi (nested CV + uji temporal)
        run: python scripts/train_model.py docs/reviews.csv
      - name: Commit model dan laporan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ reports/
          git diff --cached --quiet || git commit -m "chore: latih ulang model sentimen"
          git pull --rebase
          git push
